name: Update data

on:
  schedule:
    # Every 15 minutes during Euronext trading hours (times are UTC;
    # this window covers 09:00-17:30 Amsterdam time in summer and winter)
    - cron: "*/15 7-16 * * 1-5"
    # Every 3 hours otherwise, to keep the news fresh
    - cron: "17 */3 * * *"
  # Lets you run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and news
        run: python scripts/fetch_data.py

      - name: Save data/data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update market data"
            git push
          fi
